<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jamm — Administration</title>
  <style>
    :root{--ink:#1d2b24;--green:#17654f;--paper:#fbfaf6;--line:#dbe4db;--muted:#68766e;--amber:#a76213;--red:#a53526}*{box-sizing:border-box}body{margin:0;background:#f3f5f0;color:var(--ink);font:16px Arial,sans-serif}.shell{max-width:1200px;margin:auto;padding:32px 22px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:32px}.brand{font:700 29px Georgia,serif;color:var(--ink);text-decoration:none}.brand span{color:var(--green)}.eyebrow{margin:0;color:#7a8980;letter-spacing:.13em;font:700 12px monospace}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 8px 24px #1232 0}.login{width:min(440px,100%);margin:10vh auto}.login h1,h1,h2{font-family:Georgia,serif}.login h1{font-size:34px}.muted{color:var(--muted);line-height:1.5}.grid{display:grid;grid-template-columns:240px 1fr;gap:22px}.sidebar{align-self:start}.nav-button,.button{border:0;border-radius:9px;padding:11px 14px;font:700 14px Arial;cursor:pointer}.nav-button{width:100%;text-align:left;background:transparent;color:var(--ink);margin:3px 0}.nav-button.active,.button{background:var(--green);color:white}.button.secondary{background:#edf2eb;color:#285b49}.button.danger{background:#fff1ee;color:var(--red)}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd7cc;border-radius:9px;background:white;font:15px Arial}label{display:block;font-weight:700;font-size:13px;margin:14px 0 0}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.toolbar input{max-width:360px}.stats{display:flex;gap:10px;margin:17px 0}.stat{background:#edf4ee;border-radius:11px;padding:12px 15px;min-width:120px}.stat strong{display:block;font-size:24px}.entries{display:grid;gap:9px;margin-top:18px}.entry{width:100%;text-align:left;border:1px solid var(--line);background:white;border-radius:12px;padding:15px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:8px}.entry strong{font-size:16px}.entry small{color:var(--muted);display:block;margin-top:5px}.tag{border-radius:99px;padding:5px 9px;height:min-content;font-size:12px;font-weight:700;background:#edf4ee;color:#255b48}.tag.review{background:#fff2d8;color:#8d5a16}.tag.retired{background:#f5e8e5;color:#963a2d}.error{color:var(--red);margin:12px 0}.notice{padding:13px;background:#edf4ee;border-radius:10px;line-height:1.45}.modal{position:fixed;inset:0;background:#152b2088;display:grid;place-items:center;padding:20px}.modal-card{width:min(660px,100%);max-height:calc(100dvh - 40px);overflow:auto;background:var(--paper);border-radius:16px;padding:25px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.form-grid .wide{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.audit{display:grid;gap:9px}.audit-item{padding:13px;border-bottom:1px solid var(--line)}.hide{display:none!important}@media(max-width:720px){.grid{grid-template-columns:1fr}.sidebar{display:flex;gap:7px;overflow:auto}.nav-button{width:auto;white-space:nowrap}.form-grid{grid-template-columns:1fr}.top{align-items:flex-start}.form-grid .wide{grid-column:auto}}
  </style>
</head>
<body><main class="shell"><header class="top"><a class="brand" href="./"> <span>j</span>amm <small>Administration</small></a><button id="sign-out" class="button secondary hide">Se déconnecter</button></header><section id="app"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js?v=admin20260819"></script></body></html>
